<svg viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
               <defs>
                  <!-- Gradient Background -->
                  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
                     <stop offset="0%" stop-color="#1E3308" />
                     <stop offset="100%" stop-color="#0F1D04" />
                  </linearGradient>

                  <!-- Soft Glow -->
                  <radialGradient id="glow" cx="50%" cy="50%" r="80%">
                     <stop offset="0%" stop-color="#A9E14233" />
                     <stop offset="100%" stop-color="transparent" />
                  </radialGradient>
               </defs>

               <!-- Base Gradient -->
               <rect width="1920" height="1080" fill="url(#bg)" />

               <!-- Glow Overlay -->
               <rect width="1920" height="1080" fill="url(#glow)" />

               <!-- 3D Blocks -->
               <g opacity="0.18" fill="#A9E142">
                  <rect x="1600" y="150" width="140" height="140" rx="6" />
                  <rect x="1450" y="320" width="140" height="140" rx="6" opacity="0.8" />
                  <rect x="1650" y="360" width="140" height="140" rx="6" opacity="0.6" />

                  <rect x="180" y="700" width="140" height="140" rx="6" opacity="0.5" />
                  <rect x="300" y="860" width="140" height="140" rx="6" opacity="0.35" />
               </g>
            </svg>