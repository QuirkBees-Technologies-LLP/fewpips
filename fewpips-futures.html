    <script>
        document.querySelectorAll('.accordion-header').forEach(button => {
            button.addEventListener('click', function () {
                const item = this.closest('.accordion-item');
                const content = item.querySelector('.accordion-content');
                const chevron = this.querySelector('.accordion-chevron');
                const isOpen = this.getAttribute('aria-expanded') === 'true';

                document.querySelectorAll('.accordion-item').forEach(otherItem => {
                    if (otherItem !== item) {
                        const otherContent = otherItem.querySelector('.accordion-content');
                        const otherButton = otherItem.querySelector('.accordion-header');
                        const otherChevron = otherButton.querySelector('.accordion-chevron');
                        otherContent.style.maxHeight = '0px';
                        otherButton.setAttribute('aria-expanded', 'false');
                        otherChevron.style.transform = 'rotate(0deg)';
                    }
                });

                if (isOpen) {
                    content.style.maxHeight = '0px';
                    this.setAttribute('aria-expanded', 'false');
                    chevron.style.transform = 'rotate(0deg)';
                } else {
                    content.style.maxHeight = content.scrollHeight + 'px';
                    this.setAttribute('aria-expanded', 'true');
                    chevron.style.transform = 'rotate(180deg)';
                }
            });
        });
    </script>

    <script>
        const pdfUrl = "assets/pdf/faq.pdf";
        const container = document.getElementById("faq-container");

        pdfjsLib.getDocument(pdfUrl).promise.then(async function (pdf) {

            let fullText = "";

            for (let i = 1; i <= pdf.numPages; i++) {

                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();

                const pageText = textContent.items.map(item => item.str).join(" ");

                fullText += pageText + " ";
            }

            buildFAQ(fullText);

        });


        function buildFAQ(text) {

            // Split based on Q1 Q2 Q3 etc
            const questions = text.split(/Q\d+\./);

            questions.shift(); // remove intro text

            questions.forEach((item, index) => {

                const parts = item.split("?");

                const question = parts[0].trim() + "?";
                const answer = parts.slice(1).join("?").trim();

                const html = `

        <div class="accordion-item border border-white/20 rounded-[12px] overflow-hidden bg-white/5 hover:bg-white/10 transition-all duration-300">

            <button class="accordion-header w-full px-[24px] py-[20px] flex items-center justify-between text-left hover:bg-white/5 transition-colors" type="button" aria-expanded="false">

                <span class="text-white font-medium text-[16px] font-Inter">
                    ${question}
                </span>

                <svg class="w-6 h-6 text-white transition-transform duration-300 accordion-chevron"
                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>

                </svg>

            </button>

            <div class="accordion-content max-h-0 overflow-hidden transition-all duration-300">

                <div class="px-[24px] py-[20px] text-white/70 font-Inter text-[14px] leading-[24px] border-t border-white/10">

                    ${answer}

                </div>

            </div>

        </div>

        `;

                container.insertAdjacentHTML("beforeend", html);

            });

        }
    </script>

    <script>
        document.addEventListener("click", function (e) {

            if (e.target.closest(".accordion-header")) {

                const button = e.target.closest(".accordion-header");
                const item = button.closest(".accordion-item");
                const content = item.querySelector(".accordion-content");
                const chevron = button.querySelector(".accordion-chevron");

                const isOpen = button.getAttribute("aria-expanded") === "true";

                document.querySelectorAll(".accordion-content").forEach(c => {
                    c.style.maxHeight = null;
                });

                document.querySelectorAll(".accordion-chevron").forEach(c => {
                    c.style.transform = "rotate(0deg)";
                });

                document.querySelectorAll(".accordion-header").forEach(b => {
                    b.setAttribute("aria-expanded", "false");
                });

                if (!isOpen) {

                    content.style.maxHeight = content.scrollHeight + "px";
                    button.setAttribute("aria-expanded", "true");
                    chevron.style.transform = "rotate(180deg)";

                }

            }

        });
    </script>
